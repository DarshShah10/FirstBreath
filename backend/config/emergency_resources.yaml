# City conditions that can affect response
city_conditions:
  # Common road blocks or events
  events:
    - event_id: "festival_main_road"
      name: "Spring Festival Parade"
      affected_route: "route_patient_central_main"
      status: "inactive"  # inactive, active, ended
      start_time: "2026-03-20T09:00:00"
      end_time: "2026-03-20T12:00:00"

    - event_id: "construction_ring_road"
      name: "Ring Road Construction"
      affected_route: "route_patient_emergency_alt"
      status: "active"
      expected_duration_hours: 48

  # Traffic patterns (for simulation)
  traffic_patterns:
    peak_morning: "07:00-09:00"
    peak_evening: "17:00-19:00"
    normal_multiplier: 1.0
    peak_multiplier: 1.5

  # Weather conditions
  weather:
    default_status: "clear"  # clear, light_rain, heavy_rain, fog
    traffic_impact:
      clear: 1.0
      light_rain: 1.2
      heavy_rain: 1.5
      fog: 1.3
