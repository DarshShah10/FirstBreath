[project]
name = "firstbreath-backend"
version = "0.2.0"
description = "FirstBreath - multi-agent emergency response simulation for the Golden Hour"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "FirstBreath Team" }
]

dependencies = [
    # Core Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "flask-socketio>=5.3.0",
    # Database (Supabase Postgres)
    "supabase>=2.0.0",
    "psycopg[binary]>=3.1.0",
    # LLM (OpenRouter / OpenAI-compatible)
    "openai>=1.0.0",
    "httpx>=0.25.0",
    # File Processing
    "PyMuPDF>=1.24.0",
    # Encoding Detection
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # Utility Libraries
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
