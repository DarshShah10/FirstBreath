# Transport routes between key locations
# These will be dynamically matched based on coordinates
routes:
  # Patient to Central Hospital routes
  - route_id: "route_patient_central_main"
    from_location:
      lat: 28.6100
      lng: 77.2000
      address: "Patient Location - Sector 12"
    to_location:
      lat: 28.6139
      lng: 77.2090
      address: "Central Maternity Hospital"
    distance_km: 1.5
    typical_duration_minutes: 5
    traffic_multiplier: 1.5
    alternate_route_available: true
    alternate_route_id: "route_patient_central_alt"
    current_status: "clear"

  - route_id: "route_patient_central_alt"
